name: CI

# Guards the core against regressions before anything reaches production.
#
# Two of these steps are ratchets rather than pass/fail gates. That is
# deliberate: this codebase has ~3000 pre-existing lint errors and 32 type
# errors, and the build sets both `DISABLE_ESLINT_PLUGIN=true` and
# `typescript.ignoreBuildErrors: true`, which is how they went unnoticed.
# Demanding zero would put CI permanently red and teach everyone to ignore it.
# Demanding "no worse than today" stops the backlog growing while it is paid
# down. See ARCHITECTURE.md §8.
#
# ── Baselines, measured on the merge of #944 into main, 2026-09-10 ──────────
#   typecheck : 32     (unchanged by adding lib/core — it was 32 before too)
#   lint      : 3035 errors, 378 warnings (602 files, includes lib/core)
#
# Both were measured by running the exact commands below. If CI's very first
# run reports a different number, the difference is the runner's dependency
# resolution, not a regression — set the baseline to what it reports on the
# merge commit, then only ever LOWER it.
#
# `staging` has its own `.github/workflows/ci.yml` with different baselines.
# The two are deliberately separate files with the same name — the branches are
# a fork and are never branch-merged, so they will not fight; a cherry-pick
# that touches this file will conflict, and the resolution is always "keep this
# branch's baselines".

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only: nothing here writes to the repo, so nothing here should be able to.
permissions:
  contents: read

# Supersede an in-flight run when a PR is pushed to again. A push to main is
# never cancelled — every commit that reaches production gets its own verdict.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # --legacy-peer-deps matches CLAUDE.md; npm ci without it fails on this tree.
      - name: Install
        run: npm ci --legacy-peer-deps

      # THE architecture gate — hard fail, no ratchet.
      # Fast and targeted, so a violation is visible instead of being buried in
      # the thousands of pre-existing findings a full lint reports.
      - name: Core/Feature boundary
        run: npm run lint:boundaries

      # Unit tests over lib/core/**, plus the React-hooks gate via `posttest`.
      # The hooks rule catches the error #310 class that took capture down for
      # two days; the first thing it found on main was a conditional
      # `useCallback` on the admin inventory-import page.
      - name: Unit tests
        run: npm run test

      # Ratchet: fails only if the type-error count goes UP.
      # Lower the baseline whenever you clear some — never raise it.
      - name: Typecheck (no new errors)
        env:
          TS_ERROR_BASELINE: '32'
        run: |
          COUNT=$(npx tsc --noEmit 2>&1 | grep -c "error TS" || true)
          echo "Type errors: $COUNT (baseline $TS_ERROR_BASELINE)"
          if [ "$COUNT" -gt "$TS_ERROR_BASELINE" ]; then
            echo "::error::Type errors rose from $TS_ERROR_BASELINE to $COUNT. New code must be type-clean."
            npx tsc --noEmit 2>&1 | grep "error TS" || true
            exit 1
          fi
          if [ "$COUNT" -lt "$TS_ERROR_BASELINE" ]; then
            echo "::notice::Type errors down to $COUNT — lower TS_ERROR_BASELINE in .github/workflows/ci.yml."
          fi

      # Ratchet: same idea for lint. Lower the baseline as it comes down.
      - name: Lint (no new errors)
        env:
          LINT_ERROR_BASELINE: '3035'
        run: |
          npx eslint --format json --output-file eslint-report.json . || true
          COUNT=$(node -e "const r=require('./eslint-report.json');console.log(r.reduce((t,f)=>t+f.errorCount,0))")
          echo "Lint errors: $COUNT (baseline $LINT_ERROR_BASELINE)"
          if [ "$COUNT" -gt "$LINT_ERROR_BASELINE" ]; then
            echo "::error::Lint errors rose from $LINT_ERROR_BASELINE to $COUNT."
            exit 1
          fi
          if [ "$COUNT" -lt "$LINT_ERROR_BASELINE" ]; then
            echo "::notice::Lint errors down to $COUNT — lower LINT_ERROR_BASELINE in .github/workflows/ci.yml."
          fi

# Not run here: the Playwright suite. It needs a saved browser session (SSO is
# not scriptable), so in CI every spec would skip — a green tick proving
# nothing. See ARCHITECTURE.md §8.
