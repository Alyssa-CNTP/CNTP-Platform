name: Deploy to Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 154.65.97.200
          username: cntpdev
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 2022
          script: |
            export NVM_DIR="$HOME/.nvm" && source "$NVM_DIR/nvm.sh"
            cd /home/cntpdev/apps/staging/app/cntp-ops
            git pull origin staging
            rm -rf .next
            npm run build 2>&1 | tail -20
            /home/cntpdev/.nvm/versions/node/v24.16.0/bin/pm2 restart cntp-staging
            echo "✅ Deployed successfully"

            # Leaf Shade Classifier (ml/leafshade) is a PRODUCTION-only service —
            # deliberately not started/managed from here. See deploy-production.yml
            # for the self-healing `docker compose up -d` step and why it lives
            # there instead: the compose file pins a fixed container_name and a
            # fixed host port (network_mode: host), so only ONE instance can run
            # on this VPS at a time — staging and production must not both try to
            # own it.
